<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>お悔やみページ 埋め込み表示テスト</title>
<style>
  body { font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; margin: 0; background: #f4f2ee; color: #222; }
  header { background: #2b2b2b; color: #fff; padding: 16px 20px; }
  header h1 { margin: 0; font-size: 18px; font-weight: 600; }
  main { max-width: 1000px; margin: 0 auto; padding: 20px; }
  .note { background: #fff; border-left: 4px solid #8a7a5c; padding: 12px 16px; font-size: 14px; line-height: 1.7; margin-bottom: 20px; }
  .frame-wrap { background: #fff; padding: 12px; border: 1px solid #ddd; }
  code { background: #eee; padding: 1px 5px; border-radius: 3px; font-size: 13px; }
</style>
</head>
<body>
<header><h1>（テスト）サンプル葬儀社 ホームページ ― お悔やみ情報</h1></header>
<main>
  <div class="note">
    下の枠内にお悔やみページが表示されれば、iframeでの埋め込みは動いています。<br>
    枠が空白のまま、または「接続が拒否されました」と表示される場合は、itowa側で埋め込みが制限されています。<br>
    確認対象：<code>https://biz.itowa71.com/cf0a882a-f72a-4a7b-acf3-ab1a7a6d2eb8/</code>
  </div>
  <div class="frame-wrap">
    <iframe
      src="https://biz.itowa71.com/cf0a882a-f72a-4a7b-acf3-ab1a7a6d2eb8/"
      title="お悔やみ情報"
      width="100%"
      height="1200"
      style="border:0; max-width:100%;"
      loading="lazy">
    </iframe>
  </div>
</main>
</body>
</html>
